<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<!-- Number Hop's web page (the Web export preset's custom HTML shell, see
		     tools/export_web.sh). Same start-up logic as Godot's default shell, plus a
		     warm loading card, a friendly error card and phone settings: no pinch or
		     double-tap zoom, no pull-to-refresh, no text selection or long-press
		     menus, the game kept clear of notches (no viewport-fit=cover), home screen app
		     (PWA) metadata, a new upload picked up on the next start (no closing tabs or
		     clearing data), and ?seed=N / ?autoplay (and the look's debug switches,
		     scripts/debug/web_debug.gd) passed to the game. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
		<meta name="description" content="Number Hop: hop onto smaller numbers and grow your Numberblock from 5 to 1000 (or a million!). A friendly number game for kids.">
		<meta name="theme-color" content="#f3eee6">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-title" content="Number Hop">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<title>Number Hop</title>
		<style>
:root {
	--cream: #f3eee6;
	--ink: #3b2c24;
	--soft-ink: #7a6457;
	--aqua: #2ec5d3;
	--aqua-deep: #1a9fb0;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	overflow: hidden;
	overscroll-behavior: none;
}

body {
	color: var(--ink);
	background-color: #f3eee6;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

#canvas {
	display: block;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: min(3.5vh, 1.6rem);
	background: radial-gradient(ellipse at 50% 30%, #fffaf2 0%, #f3eee6 55%, #e9dccb 100%);
	visibility: hidden;
	opacity: 1;
	transition: opacity 0.35s ease-out;
	z-index: 1;
}

#status.fading {
	opacity: 0;
}

#status-icon {
	width: min(30vh, 34vw, 180px);
	height: min(30vh, 34vw, 180px);
	border-radius: 22%;
	box-shadow: 0 0.6rem 1.6rem rgba(90, 60, 30, 0.22);
	animation: hop 1.1s ease-in-out infinite;
}

#status-icon[src=""] {
	visibility: hidden;
}

@keyframes hop {
	0%, 100% { transform: translateY(0) scale(1, 1); }
	12% { transform: translateY(0) scale(1.06, 0.94); }
	45% { transform: translateY(-9%) scale(0.97, 1.03); }
	78% { transform: translateY(0) scale(1.04, 0.96); }
}

#status-title {
	margin: 0;
	font-size: min(7vh, 9vw, 3rem);
	font-weight: 900;
	letter-spacing: 0.02em;
	color: var(--ink);
}

#status-progress {
	display: none;
	width: min(60vw, 26rem);
	height: 1.1rem;
	padding: 0.22rem;
	border-radius: 1rem;
	background: rgba(120, 90, 60, 0.16);
	box-shadow: inset 0 2px 4px rgba(90, 60, 30, 0.18);
	box-sizing: border-box;
}

#status-bar {
	width: 6%;
	height: 100%;
	border-radius: 1rem;
	background: linear-gradient(180deg, #6fe0ea 0%, var(--aqua) 55%, var(--aqua-deep) 100%);
	transition: width 0.25s ease-out;
}

#status-progress.indeterminate #status-bar {
	width: 30%;
	animation: slide 1.2s ease-in-out infinite alternate;
}

@keyframes slide {
	from { transform: translateX(0); }
	to { transform: translateX(233%); }
}

#status-caption {
	display: none;
	margin: 0;
	font-size: min(3.2vh, 1.15rem);
	font-weight: 700;
	color: var(--soft-ink);
}

#status-notice {
	display: none;
	max-width: 30rem;
	margin: 0 1.5rem;
	padding: 1.1rem 1.4rem;
	border-radius: 1.2rem;
	background: #fff8ef;
	box-shadow: 0 0.4rem 1.2rem rgba(90, 60, 30, 0.18);
	color: var(--ink);
	line-height: 1.35;
	text-align: center;
	font-size: 1.05rem;
}

#status-notice small {
	display: block;
	margin-top: 0.8rem;
	color: var(--soft-ink);
	font-size: 0.8rem;
	word-break: break-word;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Number Hop needs JavaScript to run.
		</noscript>

		<div id="status">
			<img id="status-icon" src="" alt="">
			<h1 id="status-title">Number Hop</h1>
			<div id="status-progress"><div id="status-bar"></div></div>
			<p id="status-caption">Stacking the blocks...</p>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8631404,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusIcon = document.getElementById('status-icon');
	const statusProgress = document.getElementById('status-progress');
	const statusBar = document.getElementById('status-bar');
	const statusCaption = document.getElementById('status-caption');
	const statusNotice = document.getElementById('status-notice');
	const captions = ['Stacking the blocks...', 'Painting the numbers...', 'Polishing the tiles...', 'Waking up Five...'];

	let initializing = true;
	let statusMode = '';

	// The game's icon, as exported for the home screen (index.144x144.png).
	const executable = GODOT_CONFIG['executable'] || 'index';
	statusIcon.src = executable + '.144x144.png';
	statusIcon.addEventListener('error', () => {
		statusIcon.style.display = 'none';
	});

	// No browser zoom gestures on iOS Safari (touch-action does not stop them there).
	['gesturestart', 'gesturechange', 'gestureend'].forEach((type) => {
		document.addEventListener(type, (event) => event.preventDefault(), { passive: false });
	});
	// Taps anywhere give the game the keyboard focus again (e.g. after switching tabs).
	document.addEventListener('pointerdown', () => {
		const canvas = document.getElementById('canvas');
		if (canvas && document.activeElement !== canvas) {
			canvas.focus();
		}
	});

	// Game options from the address, as the game's own command line options
	// (scripts/main.gd): ?seed=42 plays board 42 (to share a board), ?autoplay lets
	// the robot play (demos, tools/web_smoke.sh). The look's debug switches
	// (scripts/debug/web_debug.gd) go on as they are: ?glow=0, ?glowcap=2, ?gloss=0.3,
	// ?coat=0, ?specaa=0, ?sunsize=0, ?shadows=steady, ?msaa=0|2|4|8, ?scale3d=0.8;
	// ?fixedfps=60 is the engine's own --fixed-fps 60 (every frame is 1/60 s of game
	// time). Nothing else is passed on.
	function gameArgs() {
		const query = new URLSearchParams(window.location.search);
		const args = [];
		const seed = query.get('seed') || '';
		if (/^[0-9]{1,9}$/.test(seed)) {
			args.push('--seed=' + seed);
		}
		if (query.has('autoplay')) {
			args.push('--autoplay');
		}
		if (query.get('difficulty') === 'hard' || query.has('hard')) {
			args.push('--difficulty=hard');
		} else if (query.get('difficulty') === 'extreme' || query.has('extreme')) {
			args.push('--difficulty=extreme');
		}
		const number = /^[0-9]{1,3}(\.[0-9]{1,4})?$/;
		const switches = {glow: /^[01]$/, glowcap: number, gloss: number, coat: number, specaa: number,
			sunsize: number, shadows: /^steady$/, msaa: /^[0248]$/, scale3d: number};
		for (const name in switches) {
			const value = query.get(name) || '';
			if (switches[name].test(value)) {
				args.push('--' + name + '=' + value);
			}
		}
		const engineArgs = [];
		const fixedFps = query.get('fixedfps') || '';
		if (/^[1-9][0-9]{0,2}$/.test(fixedFps)) {
			engineArgs.push('--fixed-fps', fixedFps);
		}
		return args.length ? engineArgs.concat(['--'], args) : engineArgs;
	}

	// New versions: the service worker (the PWA's offline copy) starts the copy it
	// has, so a new upload would only show once every tab of the game was closed.
	// On start-up look for a new version; when one is there (or still waiting from
	// an earlier visit), switch to it and reload, but only while the game is still
	// loading (never in the middle of a game; then it waits for the next start).
	function checkForUpdate() {
		if (!GODOT_CONFIG['serviceWorker'] || !('serviceWorker' in navigator) || !navigator.serviceWorker.controller) {
			return; // no offline copy yet (first visit)
		}
		function activate(worker) {
			if (initializing) {
				worker.postMessage('update'); // the worker takes over and reloads the page
			}
		}
		function track(worker) {
			if (!worker) {
				return;
			}
			if (worker.state === 'installed') {
				activate(worker);
				return;
			}
			worker.addEventListener('statechange', () => {
				if (worker.state === 'installed') {
					activate(worker);
				}
			});
		}
		navigator.serviceWorker.getRegistration().then((registration) => {
			if (!registration) {
				return null;
			}
			if (registration.waiting) {
				activate(registration.waiting);
				return null;
			}
			track(registration.installing);
			registration.addEventListener('updatefound', () => track(registration.installing));
			return registration.update();
		}).catch((err) => {
			console.warn('Number Hop: could not look for a new version:', err);
		});
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			initializing = false;
			statusOverlay.classList.add('fading');
			setTimeout(() => statusOverlay.remove(), 400);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusCaption.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		statusNotice.appendChild(document.createTextNode('Oh no! Number Hop could not start in this browser.'));
		statusNotice.appendChild(document.createElement('br'));
		statusNotice.appendChild(document.createTextNode('Try the newest Chrome, Safari, Edge or Firefox.'));
		const details = document.createElement('small');
		text.split('\n').forEach((line) => {
			details.appendChild(document.createTextNode(line));
			details.appendChild(document.createElement('br'));
		});
		statusNotice.appendChild(details);
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'The following features are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		checkForUpdate();
		let caption = 0;
		const captionTimer = setInterval(() => {
			caption = (caption + 1) % captions.length;
			statusCaption.textContent = captions[caption];
		}, 1800);
		engine.startGame({
			'args': gameArgs(),
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.classList.remove('indeterminate');
					statusBar.style.width = Math.max(6, Math.min(100, (100 * current) / total)) + '%';
				} else {
					statusProgress.classList.add('indeterminate');
				}
			},
		}).then(() => {
			clearInterval(captionTimer);
			setStatusMode('hidden');
		}, (err) => {
			clearInterval(captionTimer);
			displayFailureNotice(err);
		});
	}
}());
		</script>
	</body>
</html>
